name: Damai Agent Python

on:
  pull_request:
    paths:
      - "damai-agent-python/**"
      - "contracts/**"
      - "damai-server/damai-program-service/pom.xml"
      - "damai-server/damai-program-service/src/main/java/com/damai/controller/agent/**"
      - "damai-server/damai-program-service/src/main/resources/log4j2.xml"
      - "damai-server/damai-program-service/src/test/java/com/damai/controller/agent/**"
      - ".github/workflows/damai-agent-python.yml"
  push:
    branches: [main, "codex/phase-*"]
    paths:
      - "damai-agent-python/**"
      - "contracts/**"
      - "damai-server/damai-program-service/pom.xml"
      - "damai-server/damai-program-service/src/main/java/com/damai/controller/agent/**"
      - "damai-server/damai-program-service/src/main/resources/log4j2.xml"
      - "damai-server/damai-program-service/src/test/java/com/damai/controller/agent/**"
      - ".github/workflows/damai-agent-python.yml"

permissions:
  contents: read

concurrency:
  group: damai-agent-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: damai_test
          POSTGRES_PASSWORD: damai_test
          POSTGRES_DB: damai_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U damai_test -d damai_agent_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DAMAI_TEST_POSTGRES_DSN: postgresql://damai_test:damai_test@127.0.0.1:5432/damai_agent_test
      DAMAI_TEST_REDIS_HOST: 127.0.0.1
      DAMAI_TEST_REDIS_PORT: "6379"
    defaults:
      run:
        working-directory: damai-agent-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: damai-agent-python/uv.lock

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.10
          uv sync --frozen --extra dev --extra postgres --extra redis --extra observability --python 3.11

      - name: Verify generated contracts
        run: |
          uv run --frozen --extra dev --extra postgres --extra redis --extra observability openapi-spec-validator ../contracts/agent-tools-v1.openapi.yaml
          uv run --frozen --extra dev --extra postgres --extra redis --extra observability python scripts/generate_tool_schemas.py --check
          uv run --frozen --extra dev --extra postgres --extra redis --extra observability python scripts/check_contract_compatibility.py
          uv run --frozen --extra dev --extra postgres --extra redis --extra observability python scripts/evaluate_rag.py --catalog tests/fixtures/rag_catalog.json --eval-set tests/fixtures/rag_eval.json --source-host help.example.com

      - name: Lint and format
        run: |
          uv run --frozen --extra dev --extra postgres --extra redis --extra observability ruff format --check damai_agent tests scripts
          uv run --frozen --extra dev --extra postgres --extra redis --extra observability ruff check damai_agent tests scripts

      - name: Type check
        run: uv run --frozen --extra dev --extra postgres --extra redis --extra observability mypy damai_agent

      - name: Test and enforce coverage
        run: uv run --frozen --extra dev --extra postgres --extra redis --extra observability pytest --cov=damai_agent --cov-report=term-missing --cov-report=xml

  java-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Java Agent contract and trace context
        run: >-
          mvn -B -ntp
          -pl damai-server/damai-program-service
          -am
          -Dtest='AgentTool*'
          -Dsurefire.failIfNoSpecifiedTests=false
          test
