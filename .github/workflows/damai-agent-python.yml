name: Damai Agent Python

on:
  pull_request:
    paths:
      - "damai-agent-python/**"
      - "contracts/**"
      - "damai-server/damai-program-service/pom.xml"
      - "damai-server/damai-program-service/src/main/java/com/damai/controller/agent/**"
      - "damai-server/damai-program-service/src/main/resources/log4j2.xml"
      - "damai-server/damai-program-service/src/test/java/com/damai/controller/agent/**"
      - ".github/workflows/damai-agent-python.yml"
  push:
    branches: [main]
    paths:
      - "damai-agent-python/**"
      - "contracts/**"
      - "damai-server/damai-program-service/pom.xml"
      - "damai-server/damai-program-service/src/main/java/com/damai/controller/agent/**"
      - "damai-server/damai-program-service/src/main/resources/log4j2.xml"
      - "damai-server/damai-program-service/src/test/java/com/damai/controller/agent/**"
      - ".github/workflows/damai-agent-python.yml"

permissions:
  contents: read

concurrency:
  group: damai-agent-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: damai-agent-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: damai-agent-python/uv.lock

      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.10
          uv sync --frozen --extra dev --python 3.11

      - name: Verify generated contracts
        run: |
          uv run --frozen --extra dev openapi-spec-validator ../contracts/agent-tools-v1.openapi.yaml
          uv run --frozen --extra dev python scripts/generate_tool_schemas.py --check
          uv run --frozen --extra dev python scripts/check_contract_compatibility.py

      - name: Lint and format
        run: |
          uv run --frozen --extra dev ruff format --check damai_agent tests scripts
          uv run --frozen --extra dev ruff check damai_agent tests scripts

      - name: Type check
        run: uv run --frozen --extra dev mypy damai_agent

      - name: Test and enforce coverage
        run: uv run --frozen --extra dev pytest --cov=damai_agent --cov-report=term-missing --cov-report=xml

  java-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Java Agent contract and trace context
        run: >-
          mvn -B -ntp
          -pl damai-server/damai-program-service
          -am
          -Dtest='AgentTool*'
          -Dsurefire.failIfNoSpecifiedTests=false
          test
