#服务端口
server:
  port: 6086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
# 应用名称
spring:
  profiles:
    active: local
  application:
    name: ${prefix.distinction.name:damai}-program-service
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      generator:
        WRITE_NUMBERS_AS_STRINGS: true
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-program-${spring.profiles.active}.yaml
  data:  
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 3000
      jedis:
        pool:
          max-active: 300  
      stream:
        streamName: invalid_program
        consumerType: broadcast
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
      eager: true
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    topic: create_order

bloom-filter:
  name: program-detail-bloom-filter
  expectedInsertions: 1000
  falseProbability: 0.01
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement
feign:
  sentinel:
    enabled: false
  hystrix:
    enabled: true
  httpclient:
    enabled: false
  okhttp:
    enabled: true
  compression:
    request:
      enabled: true
      mime-types: text/xml,application/xml,application/json
      min-request-size: 512
    response:
      enabled: true
management:
  metrics:
    tags:
      application: program-service
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
jasypt:
  encryptor:
    password: bgtjkjl!%^sdc
    algorithm: PBEWithMD5AndDES
elasticsearch:
  ip: 127.0.0.1:9200
  userName: elastic
  passWord: elastic
delay:
  queue:
    corePoolSize: 1
    maximumPoolSize: 1
    isolationRegionCount: 4
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      #生成文档所需的扫包路径，一般为启动类目录
      packages-to-scan: com.damai.controller
agent:
  purchase-intents:
    enabled: ${AGENT_PURCHASE_INTENTS_ENABLED:false}
    quote-ttl-seconds: ${AGENT_PURCHASE_QUOTE_TTL_SECONDS:120}
    grant-ttl-seconds: ${AGENT_CONFIRMATION_GRANT_TTL_SECONDS:90}
    confirmation-clock-skew-seconds: ${AGENT_CONFIRMATION_CLOCK_SKEW_SECONDS:120}
  watch-rules:
    enabled: ${AGENT_WATCH_RULES_ENABLED:false}
    scheduler-enabled: ${AGENT_WATCH_SCHEDULER_ENABLED:false}
    scheduler-instance-id: ${AGENT_WATCH_SCHEDULER_INSTANCE_ID:${HOSTNAME:local}}
    scheduler-fixed-delay-ms: ${AGENT_WATCH_SCHEDULER_FIXED_DELAY_MS:5000}
    scheduler-lease-seconds: ${AGENT_WATCH_SCHEDULER_LEASE_SECONDS:60}
    scheduler-scan-partitions: ${AGENT_WATCH_SCHEDULER_SCAN_PARTITIONS:4}
    scheduler-batch-size: ${AGENT_WATCH_SCHEDULER_BATCH_SIZE:50}
    notification-enabled: ${AGENT_WATCH_NOTIFICATION_ENABLED:false}
    notification-topic: ${AGENT_WATCH_NOTIFICATION_TOPIC:damai-agent-watch-notification}
    notification-cooldown-seconds: ${AGENT_WATCH_NOTIFICATION_COOLDOWN_SECONDS:900}
    notification-publisher-id: ${AGENT_WATCH_NOTIFICATION_PUBLISHER_ID:${HOSTNAME:local}}
    notification-publish-delay-ms: ${AGENT_WATCH_NOTIFICATION_PUBLISH_DELAY_MS:1000}
    notification-publish-timeout-ms: ${AGENT_WATCH_NOTIFICATION_PUBLISH_TIMEOUT_MS:5000}
    notification-outbox-lease-seconds: ${AGENT_WATCH_NOTIFICATION_OUTBOX_LEASE_SECONDS:30}
    notification-retry-seconds: ${AGENT_WATCH_NOTIFICATION_RETRY_SECONDS:5}
    notification-maximum-attempts: ${AGENT_WATCH_NOTIFICATION_MAXIMUM_ATTEMPTS:8}
    notification-batch-size: ${AGENT_WATCH_NOTIFICATION_BATCH_SIZE:50}
    notification-consumer-group: ${AGENT_WATCH_NOTIFICATION_CONSUMER_GROUP:damai-watch-notification-v1}
    notification-consumer-backoff-ms: ${AGENT_WATCH_NOTIFICATION_CONSUMER_BACKOFF_MS:1000}
    notification-consumer-retries: ${AGENT_WATCH_NOTIFICATION_CONSUMER_RETRIES:2}
#knife4j配置
knife4j:
  #是否启用增强设置
  enable: true
  #开启生产环境屏蔽
  production: false
  #是否启用登录认证
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true
