openapi: 3.0.3
info:
  title: Damai Java Agent Tool Gateway
  version: 1.0.0
  description: >-
    Python Agent 调用 Java 购票业务的第一版内部契约。当前只开放节目查询、
    节目详情和票档余量三个只读工具，不包含下单、锁座和支付。
servers:
  - url: http://127.0.0.1:6086
    description: 本地 Program Service
security:
  - AgentKey: []
paths:
  /internal/agent/v1/tools/programs/search:
    post:
      operationId: searchPrograms
      summary: 搜索节目
      x-agent-tool-name: search_programs
      x-agent-description: 按节目名、艺人、城市、分类和时间范围搜索演出。未知节目 ID 时先调用此工具。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramSearchRequest'
      responses:
        '200':
          description: 工具业务结果；success=false 表示业务执行失败
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/programs/detail:
    post:
      operationId: getProgramDetail
      summary: 查询节目详情
      x-agent-tool-name: get_program_detail
      x-agent-description: 根据节目 ID 查询演出详情、购票规则和入场说明。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        $ref: '#/components/requestBodies/ProgramIdBody'
      responses:
        '200':
          description: 节目详情工具结果
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProgramDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/programs/ticket-categories:
    post:
      operationId: listTicketCategories
      summary: 查询票档价格与余量
      x-agent-tool-name: list_ticket_categories
      x-agent-description: 根据节目 ID 查询票档、价格与当前剩余数量。余量只代表 freshnessAt 对应时刻。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        $ref: '#/components/requestBodies/ProgramIdBody'
      responses:
        '200':
          description: 票档工具结果；余量只代表 freshnessAt 对应时刻
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  headers:
    TraceParent:
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      description: 回传请求中的 W3C Trace Context，供调用方验证链路连续性
  securitySchemes:
    AgentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
  parameters:
    ToolCallId:
      name: X-Agent-Tool-Call-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Python Agent 生成的单次工具调用 id
    TurnId:
      name: X-Agent-Turn-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    SessionKey:
      name: X-Agent-Session-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    TraceParent:
      name: traceparent
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      description: W3C Trace Context；Python 创建 trace-id 和当前客户端 span-id
  requestBodies:
    ProgramIdBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgramIdRequest'
  responses:
    Unauthorized:
      description: Agent Key 缺失或错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ToolResponse'
  schemas:
    ProgramSearchRequest:
      type: object
      additionalProperties: false
      properties:
        keyword:
          type: string
          maxLength: 100
          description: 节目名或艺人关键词
        areaId:
          type: integer
          format: int64
          description: 城市或区域 ID
        parentProgramCategoryId:
          type: integer
          format: int64
          description: 父节目分类 ID
        programCategoryId:
          type: integer
          format: int64
          description: 节目分类 ID
        timeType:
          type: integer
          default: 0
          enum: [0, 1, 2, 3, 4, 5]
          description: 0 全部、1 今天、2 明天、3 一周内、4 一月内、5 自定义
        startDateTime:
          type: string
          example: '2026-09-03 00:00:00'
          description: 自定义开始时间，格式 yyyy-MM-dd HH:mm:ss
        endDateTime:
          type: string
          example: '2026-09-10 23:59:59'
          description: 自定义结束时间，格式 yyyy-MM-dd HH:mm:ss
        sortType:
          type: integer
          default: 1
          enum: [1, 2, 3, 4]
          description: 1 相关度、2 推荐、3 最近开场、4 最新上架
        pageNumber:
          type: integer
          minimum: 1
          default: 1
          description: 页码，从 1 开始
        pageSize:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
          description: 每页条数，最多 20
    ProgramIdRequest:
      type: object
      required: [programId]
      additionalProperties: false
      properties:
        programId:
          type: integer
          format: int64
          description: 从节目搜索结果获得的节目 ID
    ToolResponse:
      type: object
      required: [requestId, success, code, message, retryable, freshnessAt]
      properties:
        requestId:
          type: string
        success:
          type: boolean
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
        retryable:
          type: boolean
        freshnessAt:
          type: string
          format: date-time
    ProgramSearchResponse:
      allOf:
        - $ref: '#/components/schemas/ToolResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ProgramPage'
    ProgramPage:
      type: object
      properties:
        pageNum:
          type: integer
        pageSize:
          type: integer
        totalSize:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSummary'
    ProgramSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        actor:
          type: string
        place:
          type: string
        areaName:
          type: string
        programCategoryName:
          type: string
        showTime:
          type: string
        minPrice:
          type: number
        maxPrice:
          type: number
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/ProgramSummary'
        - type: object
          additionalProperties: true
          properties:
            importantNotice:
              type: string
            refundTicketRule:
              type: string
            entryRule:
              type: string
            childPurchase:
              type: string
            perOrderLimitPurchaseCount:
              type: integer
            permitChooseSeat:
              type: integer
    TicketCategory:
      type: object
      properties:
        programId:
          type: integer
          format: int64
        introduce:
          type: string
        price:
          type: number
        totalNumber:
          type: integer
          format: int64
        remainNumber:
          type: integer
          format: int64
