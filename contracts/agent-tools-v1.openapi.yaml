openapi: 3.0.3
info:
  title: Damai Java Agent Tool Gateway
  version: 1.1.0
  description: >-
    Python Agent 调用 Java 购票业务的内部契约。除节目查询、实时推荐、节目详情和
    票档余量外，阶段 5 开放受信身份下的监控规则控制面；仍不包含下单、锁座和支付。
servers:
  - url: http://127.0.0.1:6086
    description: 本地 Program Service
security:
  - AgentKey: []
paths:
  /internal/agent/v1/tools/programs/search:
    post:
      operationId: searchPrograms
      summary: 搜索节目
      x-agent-tool-name: search_programs
      x-agent-description: 按节目名、艺人、城市、分类和时间范围搜索演出。未知节目 ID 时先调用此工具。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 3
      x-agent-concurrency-safe: true
      x-agent-exclusive: false
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramSearchRequest'
      responses:
        '200':
          description: 工具业务结果；success=false 表示业务执行失败
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/programs/recommendations:
    post:
      operationId: recommendPrograms
      summary: 推荐有实时余票的节目
      x-agent-tool-name: recommend_programs
      x-agent-description: 按硬约束搜索节目，逐候选核验实时票档余量，并返回带稳定原因码的确定性排序。推荐场景必须使用此工具，不得用普通搜索替代。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 3
      x-agent-concurrency-safe: true
      x-agent-exclusive: false
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRecommendationRequest'
      responses:
        '200':
          description: 只返回完成实时票档核验且至少一个预算内票档有余量的候选
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramRecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/programs/detail:
    post:
      operationId: getProgramDetail
      summary: 查询节目详情
      x-agent-tool-name: get_program_detail
      x-agent-description: 根据节目 ID 查询演出详情、购票规则和入场说明。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 3
      x-agent-concurrency-safe: true
      x-agent-exclusive: false
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        $ref: '#/components/requestBodies/ProgramIdBody'
      responses:
        '200':
          description: 节目详情工具结果
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProgramDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/programs/ticket-categories:
    post:
      operationId: listTicketCategories
      summary: 查询票档价格与余量
      x-agent-tool-name: list_ticket_categories
      x-agent-description: 根据节目 ID 查询票档、价格与当前剩余数量。余量只代表 freshnessAt 对应时刻。
      x-agent-risk: READ_ONLY
      x-agent-scope: programs:read
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 3
      x-agent-concurrency-safe: true
      x-agent-exclusive: false
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        $ref: '#/components/requestBodies/ProgramIdBody'
      responses:
        '200':
          description: 票档工具结果；余量只代表 freshnessAt 对应时刻
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/watch-rules/create:
    post:
      operationId: createWatchRule
      summary: 创建票务监控规则
      x-agent-tool-name: create_watch_rule
      x-agent-description: 为已确认的节目创建持久化票务监控规则。该操作会产生可暂停的业务状态，只有用户明确要求监控时才能调用。
      x-agent-risk: REVERSIBLE_WRITE
      x-agent-scope: watch:write
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 1
      x-agent-concurrency-safe: false
      x-agent-exclusive: true
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Delegation'
        - $ref: '#/components/parameters/DelegationSignature'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRuleCreateRequest'
      responses:
        '200':
          description: 幂等创建后的监控规则
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/watch-rules/update:
    post:
      operationId: updateWatchRule
      summary: 修改票务监控规则
      x-agent-tool-name: update_watch_rule
      x-agent-description: 使用规则版本号修改本人监控条件。节目 ID 也是分片键，必须来自已有规则，不得猜测。
      x-agent-risk: REVERSIBLE_WRITE
      x-agent-scope: watch:write
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 1
      x-agent-concurrency-safe: false
      x-agent-exclusive: true
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Delegation'
        - $ref: '#/components/parameters/DelegationSignature'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRuleUpdateRequest'
      responses:
        '200':
          description: 修改后的监控规则
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/watch-rules/status:
    post:
      operationId: setWatchRuleStatus
      summary: 暂停或恢复票务监控规则
      x-agent-tool-name: set_watch_rule_status
      x-agent-description: 使用规则版本号暂停或恢复本人监控规则。重复设置相同状态必须保持幂等。
      x-agent-risk: REVERSIBLE_WRITE
      x-agent-scope: watch:write
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 1
      x-agent-concurrency-safe: false
      x-agent-exclusive: true
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Delegation'
        - $ref: '#/components/parameters/DelegationSignature'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRuleStatusRequest'
      responses:
        '200':
          description: 状态变更后的监控规则
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRuleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/agent/v1/tools/watch-rules/list:
    post:
      operationId: listWatchRules
      summary: 查询本人票务监控规则
      x-agent-tool-name: list_watch_rules
      x-agent-description: 分页查询当前受信用户的监控规则及版本；修改或暂停前应先用此工具获得 ruleId、programId 和 version。
      x-agent-risk: READ_ONLY
      x-agent-scope: watch:read
      x-agent-timeout-ms: 8000
      x-agent-max-calls-per-turn: 3
      x-agent-concurrency-safe: true
      x-agent-exclusive: false
      parameters:
        - $ref: '#/components/parameters/ToolCallId'
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/SessionKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Delegation'
        - $ref: '#/components/parameters/DelegationSignature'
        - $ref: '#/components/parameters/TraceParent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRuleListRequest'
      responses:
        '200':
          description: 当前用户的监控规则分页
          headers:
            traceparent:
              $ref: '#/components/headers/TraceParent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchRulePageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  headers:
    TraceParent:
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      description: 回传请求中的 W3C Trace Context，供调用方验证链路连续性
  securitySchemes:
    AgentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
  parameters:
    ToolCallId:
      name: X-Agent-Tool-Call-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Python Agent 生成的单次工具调用 id
    TurnId:
      name: X-Agent-Turn-Id
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    SessionKey:
      name: X-Agent-Session-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    TenantId:
      name: X-Agent-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: 从 Java BFF 签发的委托身份透传，禁止由模型或请求正文提供
    UserId:
      name: X-Agent-User-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: 从 Java BFF 签发的委托身份透传，Java 端据此执行行级归属校验
    Delegation:
      name: X-Agent-Delegation
      in: header
      required: true
      schema:
        type: string
        maxLength: 4096
      description: Java BFF 签发且已由 Python 验证的短期委托正文；Java Tool Gateway 必须再次验证
    DelegationSignature:
      name: X-Agent-Delegation-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      description: 委托正文的 HMAC-SHA256 签名
    TraceParent:
      name: traceparent
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      description: W3C Trace Context；Python 创建 trace-id 和当前客户端 span-id
  requestBodies:
    ProgramIdBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgramIdRequest'
  responses:
    Unauthorized:
      description: Agent Key 缺失或错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ToolResponse'
  schemas:
    ProgramSearchRequest:
      type: object
      additionalProperties: false
      properties:
        keyword:
          type: string
          maxLength: 100
          description: 节目名或艺人关键词
        areaId:
          type: integer
          format: int64
          description: 城市或区域 ID
        parentProgramCategoryId:
          type: integer
          format: int64
          description: 父节目分类 ID
        programCategoryId:
          type: integer
          format: int64
          description: 节目分类 ID
        maxPrice:
          type: number
          format: double
          minimum: 0
          maximum: 999999999.99
          description: 推荐预算硬上限；Java 会移除最低票价超过该值的候选节目
        timeType:
          type: integer
          default: 0
          enum: [0, 1, 2, 3, 4, 5]
          description: 0 全部、1 今天、2 明天、3 一周内、4 一月内、5 自定义
        startDateTime:
          type: string
          example: '2026-09-03 00:00:00'
          description: 自定义开始时间，格式 yyyy-MM-dd HH:mm:ss
        endDateTime:
          type: string
          example: '2026-09-10 23:59:59'
          description: 自定义结束时间，格式 yyyy-MM-dd HH:mm:ss
        sortType:
          type: integer
          default: 1
          enum: [1, 2, 3, 4]
          description: 1 相关度、2 推荐、3 最近开场、4 最新上架
        pageNumber:
          type: integer
          minimum: 1
          default: 1
          description: 页码，从 1 开始
        pageSize:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
          description: 每页条数，最多 20
    ProgramIdRequest:
      type: object
      required: [programId]
      additionalProperties: false
      properties:
        programId:
          type: integer
          format: int64
          description: 从节目搜索结果获得的节目 ID
    ProgramRecommendationRequest:
      type: object
      additionalProperties: false
      properties:
        keyword:
          type: string
          maxLength: 100
          description: 节目名或艺人关键词
        areaId:
          type: integer
          format: int64
          description: 城市或区域 ID
        parentProgramCategoryId:
          type: integer
          format: int64
          description: 父节目分类 ID
        programCategoryId:
          type: integer
          format: int64
          description: 节目分类 ID
        maxPrice:
          type: number
          format: double
          minimum: 0
          maximum: 999999999.99
          description: 推荐预算硬上限；Java 会再次按实时可售票档执行过滤
        timeType:
          type: integer
          default: 0
          enum: [0, 1, 2, 3, 4, 5]
          description: 0 全部、1 今天、2 明天、3 一周内、4 一月内、5 自定义
        startDateTime:
          type: string
          example: '2026-09-03 00:00:00'
          description: 自定义开始时间，格式 yyyy-MM-dd HH:mm:ss
        endDateTime:
          type: string
          example: '2026-09-10 23:59:59'
          description: 自定义结束时间，格式 yyyy-MM-dd HH:mm:ss
        sortType:
          type: integer
          default: 1
          enum: [1, 2, 3, 4]
          description: 搜索阶段排序：1 相关度、2 推荐、3 最近开场、4 最新上架
        pageNumber:
          type: integer
          minimum: 1
          default: 1
          description: 推荐服务固定从第一页开始扫描，此字段仅保留契约兼容性
        pageSize:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
          description: 推荐服务使用有界扫描窗口，此字段仅保留契约兼容性
        preference:
          type: string
          default: RELEVANCE
          enum: [RELEVANCE, LOWEST_PRICE, EARLIEST_SHOW, MOST_AVAILABLE]
          description: 仅在硬约束和实时余票过滤后应用的软排序偏好
        candidateLimit:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: 最多返回候选数量；服务端最多扫描前 10 个搜索结果
    WatchRuleCreateRequest:
      type: object
      required: [programId]
      additionalProperties: false
      properties:
        programId:
          type: integer
          format: int64
          minimum: 1
          description: 已由节目查询确认的节目 ID，也是监控规则分片键
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户可识别的规则名称
        ticketCategoryIds:
          type: array
          maxItems: 20
          items:
            type: integer
            format: int64
            minimum: 1
          description: 可选票档白名单；空集合表示监控节目下全部票档
        maxPrice:
          type: number
          format: double
          minimum: 0
          maximum: 999999999.99
          description: 只在可售价格不高于该值时触发；不设置表示不限价格
        minRemaining:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          default: 1
          description: 满足条件的票档最少剩余数量
        checkIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 86400
          default: 300
          description: Java 可靠调度器的目标检查间隔，不承诺精确触发时刻
        notificationChannel:
          type: string
          enum: [IN_APP]
          default: IN_APP
          description: 阶段 5 首批仅开放站内通知
    WatchRuleUpdateRequest:
      type: object
      required: [ruleId, programId, expectedVersion]
      additionalProperties: false
      properties:
        ruleId:
          type: integer
          format: int64
          minimum: 1
        programId:
          type: integer
          format: int64
          minimum: 1
          description: 从 list_watch_rules 获得的不可变分片键
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          description: 乐观锁版本；冲突后必须重新查询，禁止盲目覆盖
        name:
          type: string
          minLength: 1
          maxLength: 100
        ticketCategoryIds:
          type: array
          maxItems: 20
          items:
            type: integer
            format: int64
            minimum: 1
        maxPrice:
          type: number
          format: double
          minimum: 0
          maximum: 999999999.99
        clearMaxPrice:
          type: boolean
          default: false
          description: 显式移除价格上限；不能与 maxPrice 同时为真
        minRemaining:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        checkIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 86400
    WatchRuleStatusRequest:
      type: object
      required: [ruleId, programId, expectedVersion, targetStatus]
      additionalProperties: false
      properties:
        ruleId:
          type: integer
          format: int64
          minimum: 1
        programId:
          type: integer
          format: int64
          minimum: 1
          description: 从 list_watch_rules 获得的不可变分片键
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        targetStatus:
          type: string
          enum: [ACTIVE, PAUSED]
    WatchRuleListRequest:
      type: object
      additionalProperties: false
      properties:
        ruleStatus:
          type: string
          enum: [ACTIVE, PAUSED]
        pageNumber:
          type: integer
          minimum: 1
          maximum: 1000
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
    WatchRule:
      type: object
      required:
        - ruleId
        - programId
        - minRemaining
        - checkIntervalSeconds
        - notificationChannel
        - ruleStatus
        - version
        - nextCheckAt
        - createdAt
        - updatedAt
      properties:
        ruleId:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        name:
          type: string
        ticketCategoryIds:
          type: array
          items:
            type: integer
            format: int64
        maxPrice:
          type: number
        minRemaining:
          type: integer
          format: int64
        checkIntervalSeconds:
          type: integer
        notificationChannel:
          type: string
          enum: [IN_APP]
        ruleStatus:
          type: string
          enum: [ACTIVE, PAUSED]
        version:
          type: integer
          format: int64
          minimum: 1
        nextCheckAt:
          type: string
        lastCheckedAt:
          type: string
        lastTriggeredAt:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
    WatchRulePage:
      type: object
      required: [pageNumber, pageSize, totalSize, list]
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalSize:
          type: integer
          format: int64
        list:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/WatchRule'
    ToolResponse:
      type: object
      required: [requestId, success, code, message, retryable, freshnessAt]
      properties:
        requestId:
          type: string
        success:
          type: boolean
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
        retryable:
          type: boolean
        freshnessAt:
          type: string
          format: date-time
    ProgramSearchResponse:
      allOf:
        - $ref: '#/components/schemas/ToolResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ProgramPage'
    WatchRuleResponse:
      allOf:
        - $ref: '#/components/schemas/ToolResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/WatchRule'
    WatchRulePageResponse:
      allOf:
        - $ref: '#/components/schemas/ToolResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/WatchRulePage'
    ProgramPage:
      type: object
      properties:
        pageNum:
          type: integer
        pageSize:
          type: integer
        totalSize:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/ProgramSummary'
    ProgramSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        actor:
          type: string
        place:
          type: string
        areaName:
          type: string
        programCategoryName:
          type: string
        showTime:
          type: string
        minPrice:
          type: number
        maxPrice:
          type: number
    ProgramRecommendationCandidate:
      allOf:
        - $ref: '#/components/schemas/ProgramSummary'
        - type: object
          required:
            - rank
            - availableTicketCategoryCount
            - lowestAvailablePrice
            - totalRemaining
            - reasonCodes
          properties:
            rank:
              type: integer
              minimum: 1
            availableTicketCategoryCount:
              type: integer
              minimum: 1
            lowestAvailablePrice:
              type: number
              minimum: 0
            totalRemaining:
              type: integer
              format: int64
              minimum: 1
            reasonCodes:
              type: array
              minItems: 2
              maxItems: 3
              items:
                type: string
                enum:
                  - LIVE_INVENTORY_CONFIRMED
                  - BUDGET_VERIFIED
                  - RANKED_BY_RELEVANCE
                  - RANKED_BY_LOWEST_PRICE
                  - RANKED_BY_EARLIEST_SHOW
                  - RANKED_BY_MOST_AVAILABLE
    ProgramRecommendationPage:
      type: object
      required: [scannedCount, eligibleCount, preference, list]
      properties:
        scannedCount:
          type: integer
          minimum: 0
          maximum: 10
        eligibleCount:
          type: integer
          minimum: 0
          maximum: 10
        preference:
          type: string
          enum: [RELEVANCE, LOWEST_PRICE, EARLIEST_SHOW, MOST_AVAILABLE]
        list:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ProgramRecommendationCandidate'
    ProgramDetail:
      allOf:
        - $ref: '#/components/schemas/ProgramSummary'
        - type: object
          additionalProperties: true
          properties:
            importantNotice:
              type: string
            refundTicketRule:
              type: string
            entryRule:
              type: string
            childPurchase:
              type: string
            perOrderLimitPurchaseCount:
              type: integer
            permitChooseSeat:
              type: integer
    TicketCategory:
      type: object
      properties:
        programId:
          type: integer
          format: int64
        introduce:
          type: string
        price:
          type: number
        totalNumber:
          type: integer
          format: int64
        remainNumber:
          type: integer
          format: int64
    ProgramRecommendationResponse:
      allOf:
        - $ref: '#/components/schemas/ToolResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ProgramRecommendationPage'
