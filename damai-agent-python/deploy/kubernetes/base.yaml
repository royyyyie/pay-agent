apiVersion: v1
kind: ServiceAccount
metadata:
  name: damai-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: damai-agent-config
data:
  DAMAI_AGENT_ENVIRONMENT: production
  DAMAI_AGENT_PROVIDER: openai_compatible
  DAMAI_AGENT_HOST: 0.0.0.0
  DAMAI_AGENT_PORT: "9010"
  DAMAI_AGENT_SHUTDOWN_TIMEOUT_SECONDS: "45"
  DAMAI_AGENT_MAX_CONCURRENT_REQUESTS: "200"
  DAMAI_AGENT_RUNTIME_BACKEND: durable
  DAMAI_AGENT_PERSIST_TOOL_AUDIT: "true"
  DAMAI_AGENT_WATCH_RULES_ENABLED: "false"
  DAMAI_AGENT_PURCHASE_INTENTS_ENABLED: "false"
  DAMAI_AGENT_ORDER_SUBMISSION_ENABLED: "false"
  DAMAI_JAVA_BASE_URL: https://program-service.example.invalid
  DAMAI_LLM_BASE_URL: https://model-gateway.example.invalid/v1
  DAMAI_LLM_MODEL: replace-with-approved-model
---
apiVersion: v1
kind: Service
metadata:
  name: damai-agent
spec:
  selector:
    app.kubernetes.io/name: damai-agent
  ports:
    - name: http
      port: 9010
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: damai-agent
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: damai-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: damai-agent
    spec:
      serviceAccountName: damai-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: damai-agent
      containers:
        - name: agent
          image: ghcr.io/royyyyie/pay-agent/damai-agent@sha256:REPLACE_WITH_CI_IMAGE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9010
          envFrom:
            - configMapRef:
                name: damai-agent-config
            - secretRef:
                name: damai-agent-secrets
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: damai-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: damai-agent
