[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damai-agent"
version = "0.1.0"
description = "面向演出购票场景的 Python Agent 服务"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.12,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.10,<2.0",
    "openapi-spec-validator>=0.7,<1.0",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pyyaml>=6,<7",
    "ruff>=0.8,<1.0",
]

[project.scripts]
damai-agent = "damai_agent.main:run"

[tool.setuptools.packages.find]
include = ["damai_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["damai_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["damai_agent/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true
