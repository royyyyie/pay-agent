[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damai-agent"
version = "0.1.0"
description = "面向演出购票场景的 Python Agent 服务"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
damai-agent = "damai_agent.main:run"

[tool.setuptools.packages.find]
include = ["damai_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

